<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <!-- LOADING on top, faded -->
  <text x="48" y="12" text-anchor="middle" font-family="monospace" font-size="7.5" letter-spacing="2.8" fill="#8A7A60" opacity="0.95">LOADING</text>
  <g fill="#8A7A60">
    <circle cx="71" cy="10" r="1.1" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74.5" cy="10" r="1.1" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="10" r="1.1" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Rust badge bottom, faded like before -->
  <g>
    <rect y="16" width="96" height="28" rx="3.2" fill="#2E2E2E" stroke="#1E1E1E" stroke-width="0.6"/>
    <!-- rust logo hint - simple -->
    <g transform="translate(14,23)">
      <circle cx="6" cy="6" r="5.5" fill="none" stroke="#8A7A60" stroke-width="1.1" opacity="0.9"/>
      <path d="M 3 3.5 L 6 6 L 9 3.5 M 3 8.5 L 6 6 L 9 8.5" stroke="#8A7A60" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <text x="54" y="34.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.6" fill="#8A7A60" font-weight="700">RUST</text>
  </g>
</svg>
